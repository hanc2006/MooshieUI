services:
  mooshieui:
    build:
      context: .
    dockerfile: deploy/Dockerfile
    image: ghcr.io/mooshieblob1/mooshieui:latest
    ports:
      - "${MOOSHIEUI_PORT:-3200}:3200"
    volumes:
      - mooshie-data:/workspace
      - "${MODELS_PATH:-./models}:/workspace/models"
    environment:
      MOOSHIEUI_DATA_DIR: /data
      MOOSHIEUI_ADMIN_USER: "${MOOSHIEUI_ADMIN_USER:-admin}"
      MOOSHIEUI_ADMIN_PASS: "${MOOSHIEUI_ADMIN_PASS:-changeme}"
      RUST_LOG: "${RUST_LOG:-info}"
      MOOSHIEUI_TRUST_LOCALHOST: "${MOOSHIEUI_TRUST_LOCALHOST:-true}"
      # NVIDIA_VISIBLE_DEVICES is optional; remove if you’re not using nvidia runtime
      NVIDIA_VISIBLE_DEVICES: all
volumes:
  mooshie-data:
